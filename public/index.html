<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>COUP - The Dystopian Card Game</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Rajdhani:wght@300;400;500;600;700&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
<script src="/socket.io/socket.io.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#080810;--bg2:#10101c;--crimson:#c41e3a;--crimson-dark:#8b1528;
  --gold:#d4a843;--gold-light:#f0d080;--silver:#a0a8b8;
  --duke:#e91e63;--assassin:#546e7a;--ambassador:#8bc34a;--captain:#00bcd4;--contessa:#f44336;
  --text:#e8e6e3;--text-dim:#6a6a7a;--panel:#14141e;--panel2:#1c1c2a;
  --border:#2a2a3a;--glow:rgba(196,30,58,0.4);
}
html,body{height:100%;min-height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:'Rajdhani',sans-serif;overscroll-behavior:none;-webkit-overflow-scrolling:auto;touch-action:manipulation;-webkit-user-select:none;user-select:none}
body::before{content:'';position:fixed;inset:0;z-index:0;background:radial-gradient(ellipse at 50% 40%,rgba(196,30,58,0.06) 0%,transparent 60%),radial-gradient(ellipse at 20% 80%,rgba(212,168,67,0.04) 0%,transparent 40%);pointer-events:none}

.screen{display:none;position:fixed;inset:0;min-height:100dvh;z-index:1;flex-direction:column;align-items:center;justify-content:center}
.screen.active{display:flex}

/* LOBBY */
#lobby{gap:24px}
.lobby-title{font-family:'Orbitron',sans-serif;font-size:clamp(48px,10vw,80px);font-weight:900;letter-spacing:12px;color:var(--crimson);text-shadow:0 0 60px rgba(196,30,58,0.5)}
.lobby-subtitle{font-family:'Cinzel',serif;font-size:13px;letter-spacing:6px;color:var(--gold);text-transform:uppercase;opacity:0.7}
.lobby-box{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:32px;width:min(400px,90vw);display:flex;flex-direction:column;gap:14px;position:relative}
.lobby-box::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--crimson),var(--gold),var(--crimson),transparent)}
.lobby-box h2{font-family:'Cinzel',serif;font-size:16px;color:var(--gold);letter-spacing:4px;text-transform:uppercase;text-align:center}
.input-group{display:flex;flex-direction:column;gap:4px}
.input-group label{font-size:11px;letter-spacing:3px;color:var(--text-dim);text-transform:uppercase}
.input-group input{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:10px 14px;color:var(--text);font-family:'Rajdhani',sans-serif;font-size:15px;outline:none;transition:border-color 0.3s}
.input-group input:focus{border-color:var(--crimson)}
.btn{padding:12px 24px;border:none;border-radius:8px;font-family:'Rajdhani',sans-serif;font-size:15px;font-weight:700;letter-spacing:2px;text-transform:uppercase;cursor:pointer;transition:all 0.3s}
.btn-primary{background:linear-gradient(135deg,var(--crimson),var(--crimson-dark));color:white;box-shadow:0 4px 20px rgba(196,30,58,0.3)}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 6px 30px rgba(196,30,58,0.5)}
.btn-secondary{background:var(--panel2);color:var(--gold);border:1px solid var(--border)}
.btn-secondary:hover{border-color:var(--gold)}
.btn-small{padding:8px 16px;font-size:12px}
.btn-icon{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;padding:0;font-size:18px}
.divider{height:1px;background:var(--border);margin:6px 0}

/* WAITING */
#waiting{gap:20px}
.waiting-code{font-family:'Orbitron',sans-serif;font-size:22px;color:var(--gold);letter-spacing:6px}
.player-list{display:flex;flex-direction:column;gap:6px;width:min(380px,90vw)}
.player-slot{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--panel);border:1px solid var(--border);border-radius:8px}
.player-slot.filled{border-color:var(--crimson)}
.player-slot.empty{opacity:0.4;border-style:dashed}
.player-avatar{width:32px;height:32px;border-radius:50%;background:var(--crimson);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px}

/* GAME TABLE */
#game{flex-direction:column;overflow:hidden;background:var(--bg);height:100dvh;min-height:100dvh;isolation:isolate}#game::before{content:'';position:absolute;inset:0;z-index:0;pointer-events:none;background:radial-gradient(ellipse at 50% 55%,rgba(212,168,67,.035),transparent 55%),repeating-radial-gradient(circle at 20% 20%,rgba(255,255,255,.018) 0 1px,transparent 1px 5px);mix-blend-mode:screen;opacity:.45}
.game-hud{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:8px 12px;z-index:10;background:linear-gradient(180deg,rgba(8,8,16,0.95),transparent)}
.game-code{font-family:'Orbitron',sans-serif;font-size:10px;color:var(--gold);letter-spacing:2px}
.turn-indicator{font-family:'Cinzel',serif;font-size:13px;letter-spacing:2px}
.coin-display{display:flex;align-items:center;gap:4px;font-family:'Orbitron',sans-serif;font-size:13px;color:var(--gold)}
.coin-icon{width:18px;height:18px;border-radius:50%;background:linear-gradient(135deg,var(--gold),var(--gold-light));display:flex;align-items:center;justify-content:center;font-size:9px;color:var(--bg);font-weight:900;box-shadow:0 0 8px rgba(212,168,67,0.4)}

/* OVAL TABLE */
.table-container{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.oval-table{width:min(90vw,700px);height:min(70vh,500px);border-radius:50%;background:radial-gradient(ellipse at 50% 50%,#1a1a2e 0%,#11111c 68%,#080810 100%),repeating-linear-gradient(0deg,rgba(255,255,255,.018) 0 1px,transparent 1px 4px);border:8px solid #21170f;outline:1px solid rgba(212,168,67,.2);position:relative;box-shadow:0 0 60px rgba(196,30,58,0.1),inset 0 0 80px rgba(0,0,0,0.7),inset 0 0 0 2px rgba(212,168,67,.08);overflow:hidden}
.oval-table::before{content:'';position:absolute;inset:8px;border-radius:50%;border:1px solid rgba(212,168,67,0.1)}
.oval-table::after{content:'';position:absolute;inset:20px;border-radius:50%;border:1px dashed rgba(196,30,58,0.08);box-shadow:inset 0 0 90px rgba(139,195,74,.025);pointer-events:none}.oval-table .table-center::before{content:'';position:absolute;width:240px;height:180px;left:50%;top:50%;transform:translate(-50%,-50%);background:radial-gradient(ellipse,rgba(255,210,120,.08),transparent 65%);filter:blur(8px);animation:candleFlicker 2.8s ease-in-out infinite;pointer-events:none}

/* CENTER DECK & COINS */
.table-center{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:12px;z-index:5}
.deck-pile{width:80px;height:110px;position:relative;cursor:pointer;perspective:500px}
.deck-card{position:absolute;width:60px;height:82px;border-radius:6px;background:linear-gradient(135deg,var(--crimson-dark),#2a0a14);border:1px solid var(--crimson);box-shadow:0 2px 8px rgba(0,0,0,0.5);transition:all 0.3s}
.deck-card:nth-child(1){top:20px;left:8px;transform:rotate(-8deg)}
.deck-card:nth-child(2){top:16px;left:6px;transform:rotate(-5deg)}
.deck-card:nth-child(3){top:12px;left:4px;transform:rotate(-2deg)}
.deck-card:nth-child(4){top:8px;left:2px;transform:rotate(1deg)}
.deck-card:nth-child(5){top:4px;left:1px;transform:rotate(3deg)}
.deck-card:nth-child(6){top:2px;left:0;transform:rotate(-1deg)}
.deck-card:nth-child(7){top:0;left:0;transform:rotate(0deg)}
.deck-card::before{content:'';position:absolute;inset:4px;border:1px solid rgba(196,30,58,0.3);border-radius:4px;background:linear-gradient(135deg,rgba(196,30,58,0.1),transparent)}
.deck-card::after{content:'COUP';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-family:'Orbitron',sans-serif;font-size:8px;color:var(--crimson);letter-spacing:2px;opacity:0.6}
.deck-count{position:absolute;bottom:-20px;left:50%;transform:translateX(-50%);font-family:'Orbitron',sans-serif;font-size:10px;color:var(--text-dim);background:rgba(0,0,0,0.5);padding:2px 8px;border-radius:10px}
.deck-pile:hover .deck-card{transform:translateY(-4px) rotate(0deg)}
.deck-pile:hover .deck-card:nth-child(7){transform:translateY(-8px) scale(1.05)}
.coin-pile{display:flex;gap:4px;align-items:center}
.coin-pile-visual{width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,var(--gold),var(--gold-light));display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--bg);font-weight:900;box-shadow:0 0 12px rgba(212,168,67,0.3);position:relative}
.coin-pile-visual::after{content:'';position:absolute;inset:2px;border-radius:50%;border:1px solid rgba(255,255,255,0.3)}

/* OPPONENTS AROUND TABLE */
.opponent-seat{position:absolute;display:flex;flex-direction:column;align-items:center;gap:4px;transition:all 0.4s}
.opponent-seat.active{z-index:6}
.opponent-seat.dead{opacity:0.25;filter:grayscale(1)}
.seat-avatar{width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,var(--crimson),var(--crimson-dark));display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;border:2px solid var(--border);transition:all 0.3s;position:relative}
.opponent-seat.active .seat-avatar{border-color:var(--gold);box-shadow:0 0 20px rgba(212,168,67,0.4);animation:seatPulse 2s infinite}
.seat-name{font-size:11px;font-weight:600;letter-spacing:1px;white-space:nowrap}
.seat-info{display:flex;gap:6px;align-items:center;font-size:10px}
.seat-coins{color:var(--gold);font-family:'Orbitron',sans-serif}
.seat-cards{color:var(--text-dim)}
.seat-target{cursor:pointer}
.seat-target:hover .seat-avatar{border-color:var(--crimson);transform:scale(1.1)}
.seat-target.selected .seat-avatar{border-color:var(--gold);box-shadow:0 0 24px rgba(212,168,67,0.5)}

@keyframes seatPulse{0%,100%{box-shadow:0 0 20px rgba(212,168,67,0.4)}50%{box-shadow:0 0 35px rgba(212,168,67,0.7)}}

/* PLAYER HAND (BOTTOM) */
.player-hand{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);display:flex;gap:16px;z-index:10}
.hand-card{width:90px;height:125px;border-radius:8px;position:relative;cursor:pointer;transition:all 0.4s cubic-bezier(0.175,0.885,0.32,1.275);transform-style:preserve-3d}
.hand-card:hover{transform:translateY(-12px) scale(1.05)}
.hand-card-inner{width:100%;height:100%;border-radius:8px;overflow:hidden;border:2px solid var(--border);position:relative;background:var(--panel)}
.hand-card img{width:100%;height:100%;object-fit:cover}
.hand-card .card-label{position:absolute;bottom:0;left:0;right:0;padding:4px;background:linear-gradient(transparent,rgba(0,0,0,0.9));font-family:'Cinzel',serif;font-size:10px;text-align:center;letter-spacing:2px;text-transform:uppercase}
.hand-card .card-glow{position:absolute;inset:-2px;border-radius:10px;opacity:0;transition:opacity 0.3s;pointer-events:none}.hand-card-inner::before{content:'';position:absolute;inset:0;z-index:2;pointer-events:none;opacity:0;background:conic-gradient(from 90deg,transparent,rgba(255,255,255,.28),transparent 18%,rgba(212,168,67,.22),transparent 40%);mix-blend-mode:screen;transition:opacity .25s;animation:foilSweep 2.4s linear infinite}.hand-card:hover .hand-card-inner::before{opacity:.9}
.hand-card:hover .card-glow{opacity:1}

/* TIMER */
.timer-ring{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:120px;height:120px;z-index:4;pointer-events:none}
.timer-ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.timer-ring circle{fill:none;stroke-width:3}
.timer-ring .bg{stroke:rgba(255,255,255,0.05)}
.timer-ring .progress{stroke:var(--gold);stroke-dasharray:339.292;stroke-dashoffset:0;transition:stroke-dashoffset 0.1s linear;stroke-linecap:round}
.timer-text{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-family:'Orbitron',sans-serif;font-size:24px;font-weight:700;color:var(--gold);text-shadow:0 0 20px rgba(212,168,67,0.5)}

/* ACTION PANEL */
.action-panel{position:absolute;bottom:150px;left:50%;transform:translateX(-50%);background:rgba(20,20,30,0.95);border:1px solid var(--border);border-radius:12px;padding:14px;width:min(500px,90vw);z-index:20;backdrop-filter:blur(8px);display:none}
.action-panel.active{display:block;animation:slideUp 0.3s ease-out}
.action-panel h3{font-family:'Cinzel',serif;font-size:13px;color:var(--gold);letter-spacing:3px;text-transform:uppercase;text-align:center;margin-bottom:10px}
.action-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:6px}
.action-btn{display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 6px;background:var(--bg);border:1px solid var(--border);border-radius:8px;cursor:pointer;transition:all 0.3s;color:var(--text)}
.action-btn:hover{border-color:var(--crimson);background:var(--panel2);transform:translateY(-2px)}
.action-btn.disabled{opacity:0.3;pointer-events:none}
.action-btn .char-icon{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700}
.action-btn .action-name{font-size:10px;font-weight:600;letter-spacing:1px;text-align:center}
.action-btn .action-cost{font-size:9px;color:var(--text-dim)}

/* CHALLENGE PANEL */
.challenge-panel{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(20,20,30,0.95);border:1px solid var(--crimson);border-radius:12px;padding:20px;width:min(400px,85vw);z-index:25;backdrop-filter:blur(8px);display:none;text-align:center}
.challenge-panel.active{display:block;animation:slideUp 0.3s ease-out}
.challenge-panel h3{font-family:'Cinzel',serif;font-size:14px;color:var(--crimson);letter-spacing:3px;margin-bottom:12px}
.challenge-options{display:flex;flex-direction:column;gap:8px}
.challenge-option{padding:10px;background:var(--bg);border:1px solid var(--border);border-radius:8px;cursor:pointer;transition:all 0.3s;text-align:left}
.challenge-option:hover{border-color:var(--crimson);background:var(--panel2)}
.challenge-option-title{font-weight:700;color:var(--gold);font-size:13px;margin-bottom:2px}
.challenge-option-desc{font-size:11px;color:var(--text-dim)}

/* GAME LOG */
.game-log{position:absolute;top:50px;right:8px;width:min(250px,40vw);max-height:150px;overflow-y:auto;background:rgba(20,20,30,0.8);border:1px solid var(--border);border-radius:8px;padding:8px;font-size:10px;color:var(--text-dim);z-index:8;backdrop-filter:blur(4px);box-shadow:0 8px 30px rgba(0,0,0,.22)}
.game-log .log-entry{padding:2px 0;border-bottom:1px solid rgba(255,255,255,0.03)}
.game-log .log-entry.action{color:var(--gold)}
.game-log .log-entry.challenge{color:var(--crimson)}
.game-log .log-entry.counter{color:var(--captain)}
.game-log .log-entry.system{color:var(--silver)}

/* RULES BUTTON */
.rules-btn{position:absolute;top:8px;right:8px;z-index:30}

/* RULES MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.9);z-index:100;display:none;align-items:center;justify-content:center;backdrop-filter:blur(4px)}
.modal-overlay.active{display:flex}
.modal{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:24px;width:min(600px,92vw);max-height:85vh;overflow-y:auto;position:relative}
.modal::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--crimson),var(--gold),var(--crimson),transparent)}
.modal h2{font-family:'Cinzel',serif;font-size:18px;color:var(--gold);letter-spacing:4px;margin-bottom:16px;text-align:center}
.modal-close{position:absolute;top:12px;right:12px;width:32px;height:32px;border-radius:50%;background:var(--bg);border:1px solid var(--border);color:var(--text);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:16px}
.rules-img{width:100%;border-radius:8px;border:1px solid var(--border)}

/* SOUND TOGGLE + VOLUME */
.sound-btn{position:absolute;top:8px;left:50%;transform:translateX(-50%);z-index:30}
.volume-control{position:absolute;top:8px;left:calc(50% + 30px);z-index:30;display:flex;align-items:center;gap:4px}
.volume-slider{-webkit-appearance:none;appearance:none;width:60px;height:4px;border-radius:2px;background:var(--border);outline:none;opacity:0.7;transition:opacity 0.2s}
.volume-slider:hover{opacity:1}
.volume-slider::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:12px;height:12px;border-radius:50%;background:var(--gold);cursor:pointer;box-shadow:0 0 6px rgba(212,168,67,0.5)}
.volume-slider::-moz-range-thumb{width:12px;height:12px;border-radius:50%;background:var(--gold);cursor:pointer;border:none}

/* ANIMATION OVERLAY */
.anim-overlay{position:fixed;inset:0;z-index:50;pointer-events:none;overflow:hidden}
.anim-coin{position:absolute;width:24px;height:24px;border-radius:50%;background:linear-gradient(135deg,var(--gold),var(--gold-light));display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--bg);font-weight:900;box-shadow:0 0 12px rgba(212,168,67,0.6);z-index:51}
.anim-text{position:absolute;font-family:'Orbitron',sans-serif;font-weight:700;z-index:52;pointer-events:none}
.screen-shake{animation:screenShake 0.5s ease-out}
@keyframes screenShake{0%,100%{transform:translate(0)}10%{transform:translate(-8px,4px)}20%{transform:translate(6px,-6px)}30%{transform:translate(-4px,8px)}40%{transform:translate(8px,-2px)}50%{transform:translate(-6px,6px)}60%{transform:translate(4px,-4px)}70%{transform:translate(-2px,2px)}80%{transform:translate(2px,-2px)}}
.urgent-shake{animation:urgentShake 0.5s ease-out}
@keyframes urgentShake{0%,100%{transform:translate(0)}15%{transform:translate(-4px,2px) scale(1.01)}30%{transform:translate(3px,-3px)}45%{transform:translate(-2px,4px) scale(0.99)}60%{transform:translate(4px,-1px)}75%{transform:translate(-3px,3px) scale(1.01)}90%{transform:translate(2px,-2px)}}
.flash-red{animation:flashRed 0.3s ease-out}
@keyframes flashRed{0%{background:rgba(196,30,58,0.4)}100%{background:transparent}}
.flash-white{animation:flashWhite 0.2s ease-out}
@keyframes flashWhite{0%{background:rgba(255,255,255,0.6)}100%{background:transparent}}

@keyframes slideUp{from{opacity:0;transform:translate(-50%,-50%) translateY(20px)}to{opacity:1;transform:translate(-50%,-50%) translateY(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes flashFade{0%{opacity:1}100%{opacity:0}}
@keyframes coinBounce{0%{transform:scale(0) translateY(0)}50%{transform:scale(1.3) translateY(-20px)}100%{transform:scale(1) translateY(0)}}
@keyframes cardFlip{0%{transform:rotateY(0)}100%{transform:rotateY(180deg)}}
@keyframes glitch{0%,100%{transform:translate(0)}20%{transform:translate(-2px,2px)}40%{transform:translate(2px,-2px)}60%{transform:translate(-1px,-1px)}80%{transform:translate(1px,1px)}}
@keyframes radarSweep{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}
@keyframes candleFlicker{0%,100%{opacity:.35;transform:translate(-50%,-50%) scale(1)}35%{opacity:.55;transform:translate(-49%,-51%) scale(1.05)}65%{opacity:.28;transform:translate(-51%,-49%) scale(.96)}}
@keyframes foilSweep{0%{transform:translateX(-120%)}100%{transform:translateX(120%)}}
@keyframes spotlightSweep{0%{transform:translate(-50%,-50%) rotate(-18deg);opacity:.0}15%{opacity:.8}100%{transform:translate(-50%,-50%) rotate(18deg);opacity:0}}
@keyframes confettiFall{0%{transform:translateY(-20px) rotate(0);opacity:0}10%{opacity:1}100%{transform:translateY(90vh) rotate(720deg);opacity:0}}
@keyframes ashFade{0%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(.25) translateY(35px)}}


.toast-stack{position:fixed;top:58px;right:12px;z-index:180;display:flex;flex-direction:column;gap:8px;pointer-events:none}.game-toast{min-width:180px;max-width:300px;padding:10px 14px;border:1px solid var(--border);border-left:3px solid var(--gold);border-radius:10px;background:rgba(20,20,30,.94);box-shadow:0 10px 30px rgba(0,0,0,.35);backdrop-filter:blur(8px
